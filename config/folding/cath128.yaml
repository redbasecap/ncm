# Protein folding prototype: amino-acid sequence (prefix) -> CA (theta, tau) angle tokens (target).
# VQ-VAE block follows config/eval/sudoku-*.yaml; the prefix goes through the ctx_encoder path.
task: cath128
angle_tokens: 256          # k-means clusters; vocab adds TERM and PAD
context_length: 128        # residues per window
data:
  root: data/cath
  min_len: 30
  eval_min_len: 40
tokenizer:
  vqvae:
    n_layers: 4
    context_length: 128
    embed_dim: 256
    in_vocab_size: 258     # angle_tokens + TERM + PAD
    vqvae_vocab_size: [256, 256, 256, 256, 256, 256, 256, 256, 256, 256, 256, 256, 256]
    compression_factor: 1
    dropout: 0.1
    dec_layers: 1
    pre_quant_dropout: 0.0
    pre_quant_groupnorm: 8
    pre_quant_norm_type: group
    use_qk_norm: true
    vector_quantizer_config:
      clss: multiscale_residual_vector_quantizer
      decay: 0.99
      restart_threshold: 1.0  # restart dead codes; without it the codebooks collapse
      epsilon: 1.0e-05
      commitment_cost: 0.25
      learned_l1_sampling: true
      learned_all_sampling: false
      quant_resi:
        enabled: true
        ratio: 0.5
        share_mode: 0
        learnable_ratio: false
      levels:
        use_manual_levels: true
        manual_levels: [1, 2, 4, 6, 9, 13, 18, 26, 37, 52, 72, 98, 128]
      learned_l1_cascade: true
      learned_l1_cascade_base: 4
      learned_l1_cascade_norm: false
      learned_l1_cascade_norm_final: false
      aux:
        fine_drop:
          prob: 0.5
          min_keep: 1
  train:
    steps: 4000
    batch_size: 128
    lr: 5.0e-4
model:
  n_layer: 8
  n_head: 8
  bias: true
  dropout: 0.1
  n_embd: 384
  context_length: 128
  prefix_len: 128
  prefix_pad_token_id: 21  # folding.data.AA_PAD
  vocab_size: [256, 256, 256, 256, 256, 256, 256, 256, 256, 256, 256, 256, 256]
  query_level0: true
  attn_pattern: block_diagonal
  use_positional_encoding: true
  use_level_encoding: true
  use_rope: true
  rope_base: 10000
  use_qk_norm: true
  tie_heads_to_codebook: false
  use_flex_attention: false
  ctx_encoder:
    enabled: true
    n_layer: 4
    vocab_size: 22           # folding.data.AA_VOCAB
    pad_id: 21
  train:
    steps: 20000
    batch_size: 64
    lr: 3.0e-4
